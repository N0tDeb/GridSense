[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "gridsense-lab"
version = "0.4.4"
description = "Distribution-grid restoration simulation and controller testing with OpenDSS"
authors = [{name = "N0tDeb"}]
# Original code is Apache-2.0; the wheel also bundles BSD-3-Clause IEEE13 data.
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "backend/gridsense/circuits/ieee13/License.txt"]
requires-python = ">=3.12"
dependencies = [
  "OpenDSSDirect.py==0.9.4", "fastapi==0.141.1", "uvicorn==0.52.4",
  "pydantic==2.13.5", "networkx==3.6.1", "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.8"]
plots = ["matplotlib==3.10.8"]

[project.scripts]
gridsense = "gridsense.cli:main"

[project.urls]
Portfolio = "https://github.com/N0tDeb"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
gridsense = ["circuits/*.json", "circuits/ieee13/*", "references/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["var"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
# Check names and imports without rewriting fingerprinted simulation modules.
select = ["F"]
